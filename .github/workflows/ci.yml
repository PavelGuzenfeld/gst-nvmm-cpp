name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: gst-nvmm-cpp:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          docker run --rm --shm-size=256m gst-nvmm-cpp:dev \
            meson test -C builddir --verbose 2>&1 | tee test-output.txt
          # Extract pass/fail counts
          grep -E "^Ok:|^Fail:" test-output.txt

      - name: Run benchmarks
        run: |
          docker run --rm gst-nvmm-cpp:dev \
            bash -c '/src/builddir/benchmarks/bench_nvmm' > benchmark-results.csv 2>&1
          cat benchmark-results.csv

      - name: Verify plugin loads
        run: |
          docker run --rm \
            -e GST_PLUGIN_PATH=/src/builddir/gst/nvmmalloc:/src/builddir/gst/nvmmconvert:/src/builddir/gst/nvmmsink:/src/builddir/gst/nvmmappsrc \
            -e LD_LIBRARY_PATH=/src/builddir/gst/nvmmalloc:/src/builddir/gst/nvmmsink:/src/builddir/gst/nvmmappsrc \
            gst-nvmm-cpp:dev bash -c '
              gst-inspect-1.0 nvmmconvert &&
              gst-inspect-1.0 nvmmsink &&
              gst-inspect-1.0 nvmmappsrc
            '

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.csv

  # Forward-compatibility lane: same image, same tests, -Dcpp_std=c++20.
  # The shipping baseline stays C++14 (the plugins target an eventual upstream
  # GStreamer merge); this job only proves the code is C++20-clean so the
  # later migration stays cheap. See docs/PRODUCTION_PLAN.md Phase 5.
  build-and-test-cpp20:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (C++20)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.dev
          tags: gst-nvmm-cpp:dev-cpp20
          load: true
          build-args: |
            CPP_STD=c++20
          cache-from: type=gha,scope=cpp20
          cache-to: type=gha,mode=max,scope=cpp20

      - name: Run tests (C++20)
        run: |
          docker run --rm --shm-size=256m gst-nvmm-cpp:dev-cpp20 \
            meson test -C builddir --verbose 2>&1 | tee test-output-cpp20.txt
          grep -E "^Ok:|^Fail:" test-output-cpp20.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-cpp20
          path: test-output-cpp20.txt

  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for forbidden references
        run: |
          # Ensure no private data or project IP leaks into this public repo.
          # Covers .sh/.py/.yml/.txt as well: tooling scripts were previously
          # unscanned and are where site paths and dataset IDs accumulate.
          # Exclude this workflow file itself (it contains the search terms).
          if grep -riE "$FORBIDDEN" \
               --include='*.cpp' --include='*.hpp' --include='*.h' --include='*.md' \
               --include='*.sh' --include='*.py' --include='*.yml' --include='*.yaml' \
               --include='*.txt' --include='meson.build' --include='*.build' \
               . --exclude-dir=.github; then
            echo "ERROR: Found forbidden reference (private name, host path, or dataset id)"
            exit 1
          fi
          echo "OK: No forbidden references in tracked files"
        env:
          # Internal org/project names, ticket prefix, board paths and host, mission
          # domain, and evaluation-set sequence-ID prefixes.
          FORBIDDEN: 'rocx|thebandofficial|fire_arrow|mission-control|BZM-[0-9]|bzm-[0-9]|/home/nvidia|antiuav|anti-uav|wg2022|3700000000002|10\.0\.0\.41|drone'

      - name: Check commit messages for forbidden references
        run: |
          # File content is not enough -- commit messages leak too, and they are
          # far harder to scrub once pushed.
          git fetch --no-tags --depth=50 origin "${GITHUB_BASE_REF:-main}" || true
          RANGE="origin/${GITHUB_BASE_REF:-main}..HEAD"
          if ! git rev-parse "origin/${GITHUB_BASE_REF:-main}" >/dev/null 2>&1; then
            echo "SKIP: base ref unavailable"; exit 0
          fi
          if git log --format='%B' "$RANGE" | grep -inE "$FORBIDDEN"; then
            echo "ERROR: Found forbidden reference in a commit message"
            exit 1
          fi
          echo "OK: No forbidden references in commit messages"
        env:
          FORBIDDEN: 'rocx|thebandofficial|fire_arrow|mission-control|BZM-[0-9]|bzm-[0-9]|/home/nvidia|antiuav|anti-uav|wg2022|3700000000002|10\.0\.0\.41|drone'

      - name: Check license headers
        run: |
          # Verify all source files have license or copyright notice
          missing=0
          for f in $(find gst -name '*.cpp' -o -name '*.h' -o -name '*.hpp'); do
            if ! head -5 "$f" | grep -qi -e "copyright" -e "license" -e "MIT" -e "LGPL" -e "pragma once"; then
              echo "WARNING: $f may be missing license header"
              missing=$((missing + 1))
            fi
          done
          echo "$missing files may need license headers"
